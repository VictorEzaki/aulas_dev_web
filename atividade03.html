<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante JS</title>

    <link rel="stylesheet" href="./assets/styles/index.css">
    <script src="./assets/scripts/atividade03.js" defer></script>

</head>

<body>

    <div class="container">
        <div class="container-button">
            <a id="button-back" href="./index.html">Voltar</a>
        </div>

        <div id="form">
            <h1>Restaurante JS</h1>

            <span class="inputs">
                <label for="">Buffet por quilo R$:</label>
                <input type="text" id="preco-kg">
            </span>

            <span class="inputs">
                <label for="">Consumo do cliente (g):</label>
                <input type="number" id="consumo">
            </span>

            <button id="button">Calcular preço</button>

            <div id="resultado">
                <p id="valor-total">Valor a pagar: R$ </p>
            </div>
        </div>
    </div>

</body>

</html>
