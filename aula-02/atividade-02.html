<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 02</title>

    <style> 

        body {
            background-color: #474A69;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            width: 350px;
            background-color: #363B51;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            padding: 3rem;
        }

        h1 {
            color: #D7D6DA;
            border-bottom: 1px solid #D7D6DA;
            width: 90px;
            text-align: center;
        }

        input {
            background-color: #363B51;
            border: none;
            border-bottom: 1px solid #616679;
            height: 2.5rem;
        }

        button {
            height: 2.5rem;
            background-color: #A13954;
            border: none;
            color: #D7D6DA;
        }

        button:hover {
            opacity: .8;
        }

        a {
            text-decoration: none;
            color: #616679;
            text-align: center;
        }

    </style>

</head>
<body>

    <div class="card">

        <form action="">

            <h1>Login</h1>

            <input type="text" placeholder="Usuário">
            <input type="password" placeholder="Senha">

            <button>login</button>

            <a href="">Esqueceu a senha?</a>

        </form>

    </div>
    
</body>
</html>
