<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <style>
        body{
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        .second-form {
            display: flex;
            flex-direction: column;
            width: 350px;
            gap: .5rem;
        }

        tr{
            text-align: center;
        }

        td{
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Cadastro de novos materiais de aula</h1>

    <fieldset>
        <legend>Lista de materiais já cadastrados</legend>
        <form action="">
            <ol>
                <li>Lápis</li>
                <li>Caneta</li>
                <li>Papel</li>
                <li>Tesoura</li>
            </ol>
        </form>
    </fieldset>

    <fieldset>
        <legend>Cadastrar novo material</legend>
        <form action="" class="second-form">
            <input type="text" placeholder="Nome">
            <input type="number" placeholder="Preço">

            <div>
                <label for="">Quantidade:</label>
                <input type="number" name="" id="" ">
            </div>

            <div>
                <label for="">Devolução: </label>
                <span>
                    <input type=" radio" name="" id="">
                <label for="">Sim</label>
                </span>
                <span>
                    <input type="radio" name="" id="">
                    <label for="">Não</label>
                </span>
            </div>

            <div>
                <input type="reset" value="Limpar">
                <input type="submit" value="Cadastrar">
            </div>
        </form>
    </fieldset>

    <fieldset>
        <legend>Dados do último material cadastrado</legend>
        <table border="1">
            <thead>
                <tr>
                    <th>Nome</th>
                    <td>Lápis</td>
                </tr>
                <tr>
                    <th>Preço</th>
                    <td>R$ 12,30</td>
                </tr>
                <tr>
                    <th>Quantidade</th>
                    <td>200</td>
                </tr>
                <tr>
                    <th>Devolução</th>
                    <td>Sim</td>
                </tr>
            </thead>
        </table>
    </fieldset>

</body>

</html>
