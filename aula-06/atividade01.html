<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor</title>

    <link rel="stylesheet" href="./assets/styles/index.css">
    <script src="./assets/scripts/atividade01.js" defer></script>

</head>

<body>

    <div class="container">
        <div id="form">
            <h1>Video locadora</h1>

            <span class="inputs">
                <label for="">Título do filme: </label>
                <input type="text" id="nome-filme">
            </span>

            <span class="inputs">
                <label for="">Duração: </label>
                <input type="number" id="tempo-filme">
            </span>

            <button id="button">Conver em horas e minutos</button>

            <div id="resultado">
                <p id="label-filme"></p>
                <p id="label-tempo"></p>
            </div>
        </div>
    </div>

</body>

</html>
