<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermercado JS</title>

    <link rel="stylesheet" href="./assets/styles/index.css">
    <script src="./assets/scripts/atividade06.js" defer></script>

</head>

<body>

    <div class="container">
        <div class="container-button">
            <a id="button-back" href="./index.html">Voltar</a>
        </div>

        <div id="form">
            <h1>Supermercado JS</h1>

            <span class="inputs">
                <label for="">Produto:</label>
                <input type="text" id="nome-produto">
            </span>

            <span class="inputs">
                <label for="">Preço: R$</label>
                <input type="number" id="preco-produto">
            </span>

            <button id="button">Calcular</button>

            <div id="resultado">
                <p id="valor-total"></p>
                <p id="valor-produto-desconto"></p>
            </div>
        </div>
    </div>

</body>

</html>
