<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lan House JS</title>

    <link rel="stylesheet" href="./assets/styles/index.css">
    <script src="./assets/scripts/atividade05.js" defer></script>

</head>

<body>

    <div class="container">
        <div class="container-button">
            <a id="button-back" href="./index.html">Voltar</a>
        </div>

        <div id="form">
            <h1>Lan House JS</h1>

            <span class="inputs">
                <label for="">Valor por 15 minutos de uso (R$): </label>
                <input type="number" id="preco-uso">
            </span>

            <span class="inputs">
                <label for="">Tempo de uso do cliente (min)</label>
                <input type="number" id="tempo-uso">
            </span>

            <button id="button">Calcular</button>

            <div id="resultado">
                <p id="valor-total">Valor a pagar: R$ </p>
            </div>
        </div>
    </div>

</body>

</html>
